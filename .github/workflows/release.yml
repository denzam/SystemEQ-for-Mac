name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Create Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (v1.0.0 → 1.0.0)
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Archive
        run: |
          xcodebuild archive \
            -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -configuration Release \
            -archivePath build/SystemEQ.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Export .app
        run: |
          mkdir -p build/export
          cp -R "build/SystemEQ.xcarchive/Products/Applications/SystemEQ for Mac.app" build/export/

      - name: Ad-hoc sign (no Apple Developer ID required)
        run: |
          codesign --force --deep --sign - "build/export/SystemEQ for Mac.app"
          codesign --verify --verbose=2 "build/export/SystemEQ for Mac.app"

      - name: Generate DMG background
        run: |
          swift dmg-assets/generate-background.swift build/dmg-background.png

      - name: Create DMG
        run: |
          mkdir -p build/dmg_content
          cp -R "build/export/SystemEQ for Mac.app" build/dmg_content/
          cp "dmg-assets/README - HOW TO OPEN.txt" build/dmg_content/

          create-dmg \
            --volname "SystemEQ for Mac" \
            --background "build/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 96 \
            --icon "SystemEQ for Mac.app" 160 230 \
            --icon "README - HOW TO OPEN.txt" 300 320 \
            --app-drop-link 440 230 \
            --hide-extension "SystemEQ for Mac.app" \
            --no-internet-enable \
            "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg" \
            build/dmg_content \
            || {
              # Fallback if create-dmg fails
              hdiutil create -volname "SystemEQ for Mac" \
                -srcfolder build/dmg_content \
                -ov -format UDZO \
                "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg"
            }

      - name: Create ZIP
        run: |
          cd build/export
          zip -r "../SystemEQ-v${{ steps.version.outputs.version }}.zip" "SystemEQ for Mac.app"

      - name: Get file sizes
        id: sizes
        run: |
          DMG_SIZE=$(ls -lh "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg" | awk '{print $5}')
          ZIP_SIZE=$(ls -lh "build/SystemEQ-v${{ steps.version.outputs.version }}.zip" | awk '{print $5}')
          echo "dmg_size=$DMG_SIZE" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SystemEQ for Mac v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          draft: false
          make_latest: "true"
          generate_release_notes: true
          body: |
            ## SystemEQ for Mac v${{ steps.version.outputs.version }}

            ### Downloads
            | Format | Size | Description |
            |--------|------|-------------|
            | 💿 `.dmg` | ${{ steps.sizes.outputs.dmg_size }} | Recommended — drag to Applications |
            | 📦 `.zip` | ${{ steps.sizes.outputs.zip_size }} | Alternative — unzip and move to Applications |

            ### Installation
            1. Download `.dmg` file below
            2. Open the DMG and drag **SystemEQ for Mac** to **Applications**
            3. **First launch:** right-click the app → **Open** → confirm the Gatekeeper dialog
               (the app is ad-hoc signed but not notarized — Apple Developer ID is not used by this project)
            4. Alternative: open Terminal and run
               `xattr -dr com.apple.quarantine "/Applications/SystemEQ for Mac.app"`
            5. Or via Homebrew: `brew install --cask denzam/systemeq/systemeq` (quarantine flag handled automatically)

            ### Requirements
            - macOS 13 (Ventura) or later
            - Apple Silicon or Intel Mac

            ---
            *Also available via Homebrew: `brew install --cask systemeq`*
          files: |
            build/SystemEQ-v${{ steps.version.outputs.version }}.dmg
            build/SystemEQ-v${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "build/SystemEQ-v${VERSION}.dmg" | awk '{print $1}')
          echo "DMG SHA256: $SHA256"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/denzam/homebrew-systemeq.git" tap
          cd tap

          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/systemeq.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/systemeq.rb

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Cask already at v${VERSION}, nothing to do."
            exit 0
          fi

          git add Casks/systemeq.rb
          git commit -m "cask: bump to v${VERSION}"
          git push origin main
