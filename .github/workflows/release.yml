name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    name: Build DMG & Create Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check exact release commit, CI and metadata
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Select an existing release tag for workflow_dispatch"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "::error::Input version does not match the selected tag"
            exit 1
          fi
          python3 Scripts/check_release.py --check --version "$VERSION" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --require-tag \
            > "$RUNNER_TEMP/systemeq-release-check.json"
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "systemeq-release-check.json").read_text())
          delimiter = uuid.uuid4().hex
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"version={result['version']}\n")
              stream.write(f"notes<<{delimiter}\n{result['release_notes']}\n{delimiter}\n")
          PY

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Test release candidate
        run: |
          xcodebuild test \
            -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Configure temporary signing credentials
        id: credentials
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SHA1 }}
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, secrets, shlex, subprocess, tempfile
          from pathlib import Path
          os.umask(0o077)
          required = ('CERTIFICATE_P12', 'CERTIFICATE_PASSWORD', 'SIGNING_IDENTITY', 'SIGNING_TEAM', 'NOTARY_APPLE_ID', 'NOTARY_PASSWORD')
          if not all(os.environ.get(key) for key in required):
              raise SystemExit('Missing signing or notarization secrets')
          if not re.fullmatch(r'[A-Fa-f0-9]{40}', os.environ['SIGNING_IDENTITY']) or not re.fullmatch(r'[A-Z0-9]{10}', os.environ['SIGNING_TEAM']):
              raise SystemExit('Invalid signing identity metadata')
          secret_values = [os.environ[key] for key in required]
          def call(args):
              result = subprocess.run(args, capture_output=True)
              if result.returncode:
                  diagnostic = (result.stdout + result.stderr).decode(errors='replace')
                  for value in secret_values:
                      diagnostic = diagnostic.replace(value, '<redacted>')
                  raise SystemExit(f'Credential command failed: {args[0]} {args[1]} ({result.returncode})\n{diagnostic[-2000:]}')
              return result.stdout.decode()
          base = Path(os.environ['RUNNER_TEMP']).resolve()
          record = base / 'systemeq-keychain-state.json'
          if record.exists() or record.is_symlink():
              raise SystemExit('Credential state already exists')
          search = shlex.split(call(['security', 'list-keychains', '-d', 'user']))
          if not search or not all(Path(path).is_absolute() and '\n' not in path and '\r' not in path for path in search):
              raise SystemExit('Invalid original keychain search list')
          owned = Path(tempfile.mkdtemp(prefix='systemeq-signing-', dir=base))
          keychain = owned / 'signing.keychain-db'
          with record.open('x') as stream:
              json.dump({'owned': str(owned), 'keychain': str(keychain), 'search': search}, stream)
          certificate = owned / 'identity.p12'
          certificate.write_bytes(base64.b64decode(os.environ['CERTIFICATE_P12'], validate=True))
          password = secrets.token_urlsafe(32)
          secret_values.append(password)
          call(['security', 'create-keychain', '-p', password, str(keychain)])
          call(['security', 'unlock-keychain', '-p', password, str(keychain)])
          call(['security', 'set-keychain-settings', '-lut', '21600', str(keychain)])
          call(['security', 'import', str(certificate), '-k', str(keychain), '-P', os.environ['CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'])
          call(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, str(keychain)])
          call(['security', 'list-keychains', '-d', 'user', '-s', str(keychain), *search])
          call(['xcrun', 'notarytool', 'store-credentials', 'SystemEQ-CI', '--apple-id', os.environ['NOTARY_APPLE_ID'], '--team-id', os.environ['SIGNING_TEAM'], '--password', os.environ['NOTARY_PASSWORD'], '--keychain', str(keychain)])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'keychain={keychain}\n')
          PY

      - name: Build signed universal app
        id: signed
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SHA1 }}
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash Scripts/prepare_signed_release.sh --build --identity "$SIGNING_IDENTITY" --team "$SIGNING_TEAM" --record "$RUNNER_TEMP/systemeq-signed.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'systemeq-signed.json').read_text())
          run = Path(record['run']).resolve(strict=True)
          base = (Path.cwd() / 'LocalArtifacts/SignedReleases').resolve(strict=True)
          if run.parent != base or not run.name.startswith('release-') or record['phase'] != 'signed' or Path(record['manifest']) != run / 'manifest.json':
              raise SystemExit('Invalid signed run record')
          manifest = json.loads((run / 'manifest.json').read_text())
          if manifest['version'] != os.environ['VERSION'] or manifest['team'] != os.environ['SIGNING_TEAM']:
              raise SystemExit('Signed app version/team mismatch')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'run={run}\n')
          PY

      - name: Notarize and staple app
        id: notarized
        env:
          SIGNED_RUN: ${{ steps.signed.outputs.run }}
          NOTARY_KEYCHAIN: ${{ steps.credentials.outputs.keychain }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash Scripts/prepare_signed_release.sh --notarize "$SIGNED_RUN" --profile SystemEQ-CI --keychain "$NOTARY_KEYCHAIN" --record "$RUNNER_TEMP/systemeq-notarized.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'systemeq-notarized.json').read_text())
          run = Path(os.environ['SIGNED_RUN']).resolve(strict=True)
          if record['phase'] != 'notarized' or Path(record['run']).resolve(strict=True) != run or Path(record['completed']) != run / 'completed.json':
              raise SystemExit('Invalid notarization record')
          complete = json.loads((run / 'completed.json').read_text())
          if complete['version'] != os.environ['VERSION'] or complete['team'] != os.environ['SIGNING_TEAM']:
              raise SystemExit('Notarized app version/team mismatch')
          app, package = ((run / complete[key]).resolve(strict=True) for key in ('app', 'zip'))
          if not app.is_relative_to(run) or not package.is_relative_to(run) or hashlib.sha256(package.read_bytes()).hexdigest() != complete['zip_sha256']:
              raise SystemExit('Notarized package mismatch')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'app={app}\nzip={package}\n')
          PY

      - name: Generate DMG background
        run: |
          swift dmg-assets/generate-background.swift build/dmg-background.png

      - name: Create DMG
        env:
          NOTARIZED_APP: ${{ steps.notarized.outputs.app }}
        run: |
          mkdir -p build/dmg_content
          ditto "$NOTARIZED_APP" "build/dmg_content/SystemEQ for Mac.app"
          cp "dmg-assets/README - HOW TO OPEN.txt" build/dmg_content/

          create-dmg \
            --volname "SystemEQ for Mac" \
            --background "build/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 96 \
            --icon "SystemEQ for Mac.app" 160 230 \
            --icon "README - HOW TO OPEN.txt" 300 320 \
            --app-drop-link 440 230 \
            --hide-extension "SystemEQ for Mac.app" \
            --no-internet-enable \
            "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg" \
            build/dmg_content \
            || {
              # Fallback if create-dmg fails
              hdiutil create -volname "SystemEQ for Mac" \
                -srcfolder build/dmg_content \
                -ov -format UDZO \
                "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg"
            }

      - name: Finalize signed distribution packages
        env:
          SIGNED_RUN: ${{ steps.signed.outputs.run }}
          NOTARIZED_ZIP: ${{ steps.notarized.outputs.zip }}
          NOTARY_KEYCHAIN: ${{ steps.credentials.outputs.keychain }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash Scripts/prepare_signed_release.sh --notarize-dmg "$SIGNED_RUN" --dmg "build/SystemEQ-v${VERSION}.dmg" --profile SystemEQ-CI --keychain "$NOTARY_KEYCHAIN" --record "$RUNNER_TEMP/systemeq-dmg.json"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'systemeq-dmg.json').read_text())
          run = Path(os.environ['SIGNED_RUN']).resolve(strict=True)
          if record['phase'] != 'dmg' or Path(record['run']).resolve(strict=True) != run or Path(record['completed']) != run / 'dmg/completed.json':
              raise SystemExit('Invalid DMG completion record')
          complete = json.loads((run / 'dmg/completed.json').read_text())
          dmg = (run / complete['dmg']).resolve(strict=True)
          if not dmg.is_relative_to(run) or complete['version'] != os.environ['VERSION'] or complete['team'] != os.environ['SIGNING_TEAM'] or hashlib.sha256(dmg.read_bytes()).hexdigest() != complete['dmg_sha256']:
              raise SystemExit('DMG completion mismatch')
          shutil.copyfile(dmg, f"build/SystemEQ-v{os.environ['VERSION']}.dmg")
          shutil.copyfile(os.environ['NOTARIZED_ZIP'], f"build/SystemEQ-v{os.environ['VERSION']}.zip")
          PY

      - name: Get file sizes
        id: sizes
        run: |
          DMG_SIZE=$(stat -f '%z' "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg")
          ZIP_SIZE=$(stat -f '%z' "build/SystemEQ-v${{ steps.version.outputs.version }}.zip")
          if ! [[ "$DMG_SIZE" =~ ^[1-9][0-9]*$ && "$ZIP_SIZE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid distribution package size" >&2
            exit 1
          fi
          echo "dmg_size=$DMG_SIZE bytes" >> "$GITHUB_OUTPUT"
          echo "zip_size=$ZIP_SIZE bytes" >> "$GITHUB_OUTPUT"

      - name: Verify finished distribution packages
        env:
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash Scripts/verify_release_artifacts.sh --distribution "$SIGNING_TEAM" \
            "build/SystemEQ-v${{ steps.version.outputs.version }}.zip" \
            "build/SystemEQ-v${{ steps.version.outputs.version }}.dmg" \
            "${{ steps.version.outputs.version }}"

      - name: Generate and verify signed update feed
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          NOTARIZED_APP: ${{ steps.notarized.outputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/systemeq-sparkle-tools"
          curl --fail --location --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/systemeq-sparkle-tools/Sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/systemeq-sparkle-tools/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/systemeq-sparkle-tools/Sparkle.tar.xz" -C "$RUNNER_TEMP/systemeq-sparkle-tools"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'systemeq-release-check.json').read_text())
          Path('build/update-notes.txt').write_text(record['release_notes'])
          PYTHON
          python3 Scripts/build_update_feed.py --app "$NOTARIZED_APP" \
            --archive "build/SystemEQ-v${VERSION}.zip" --version "$VERSION" \
            --tools "$RUNNER_TEMP/systemeq-sparkle-tools" --output build/appcast.xml \
            --notes build/update-notes.txt

      - name: Preserve signing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-diagnostics
          path: |
            LocalArtifacts/SignedReleases/**/*.json
            LocalArtifacts/SignedReleases/**/*.log
          if-no-files-found: ignore

      - name: Remove temporary signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']).resolve()
          record = base / 'systemeq-keychain-state.json'
          if record.is_symlink():
              raise SystemExit('Symlinked credential state')
          if not record.exists():
              raise SystemExit(0)
          state = json.loads(record.read_text())
          owned = Path(state['owned'])
          keychain = Path(state['keychain'])
          if not owned.is_absolute() or owned.is_symlink() or owned.resolve(strict=True) != owned or owned.parent != base or not owned.is_dir() or not owned.name.startswith('systemeq-signing-') or keychain != owned / 'signing.keychain-db':
              raise SystemExit('Unowned credential directory')
          if keychain.is_symlink() or (keychain.exists() and not keychain.is_file()):
              raise SystemExit('Invalid credential keychain')
          if not isinstance(state['search'], list) or not state['search'] or not all(isinstance(path, str) and Path(path).is_absolute() and '\n' not in path and '\r' not in path for path in state['search']):
              raise SystemExit('Invalid original keychain search list')
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *state['search']], check=True)
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          shutil.rmtree(owned)
          record.unlink()
          PY

      - name: Recheck release eligibility before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 Scripts/check_release.py --check --version "$VERSION" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --require-tag \
            > "$RUNNER_TEMP/systemeq-release-recheck.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "SystemEQ for Mac v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          draft: false
          make_latest: "true"
          generate_release_notes: false
          body: |
            ## SystemEQ for Mac v${{ steps.version.outputs.version }}

            ${{ steps.version.outputs.notes }}

            ### Downloads
            | Format | Size | Description |
            |--------|------|-------------|
            | 💿 `.dmg` | ${{ steps.sizes.outputs.dmg_size }} | Recommended — drag to Applications |
            | 📦 `.zip` | ${{ steps.sizes.outputs.zip_size }} | Alternative — unzip and move to Applications |

            ### Installation
            1. Download `.dmg` file below
            2. Open the DMG and drag **SystemEQ for Mac** to **Applications**
            3. Open the app normally; these packages are Developer ID signed and notarized
            4. Allow the requested audio permission; signing does not grant microphone or system audio access
            5. Or via Homebrew:
               ```
               brew trust denzam/systemeq
               brew install --cask denzam/systemeq/systemeq
               ```
               Homebrew 6.0+ refuses to load third-party taps until you trust them
               once per machine; on Homebrew 5 and older, skip the first line.

            ### Requirements
            - macOS 13 (Ventura) or later
            - Apple Silicon or Intel Mac

            ---
            *Also available via Homebrew — see step 5 above.*
          files: |
            build/SystemEQ-v${{ steps.version.outputs.version }}.dmg
            build/SystemEQ-v${{ steps.version.outputs.version }}.zip
            build/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "build/SystemEQ-v${VERSION}.dmg" | awk '{print $1}')
          echo "DMG SHA256: $SHA256"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/denzam/homebrew-systemeq.git" tap
          cd tap

          cp ../Casks/systemeq.rb Casks/systemeq.rb
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/systemeq.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/systemeq.rb

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Cask already at v${VERSION}, nothing to do."
            exit 0
          fi

          git add Casks/systemeq.rb
          git commit -m "cask: bump to v${VERSION}"
          git push origin main
