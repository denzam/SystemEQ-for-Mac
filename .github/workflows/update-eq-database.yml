name: Update EQ Database

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update-database:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      
      - name: Clone AutoEQ repository
        run: |
          git clone --depth 1 https://github.com/jaakkopasanen/AutoEq.git AutoEq
          echo "AutoEQ cloned successfully"
      
      - name: Generate AutoEQ Index
        run: |
          swift Scripts/generate_autoeq_index.swift
          echo "Index generated"

      - name: Build EQ Database
        run: |
          swift Scripts/build_eq_database.swift
          echo "Database built"

      - name: Copy database to Resources
        run: |
          cp "SystemEQ for Mac/EQDatabase.db" "SystemEQ for Mac/Resources/EQDatabase.db"
          echo "Database copied to Resources"
      
      - name: Get database stats
        id: stats
        run: |
          SIZE=$(ls -lh "SystemEQ for Mac/Resources/EQDatabase.db" | awk '{print $5}')
          DATE=$(date +%Y-%m-%d)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update EQ Database (${{ steps.stats.outputs.date }})"
          title: "🔄 Update EQ Database - ${{ steps.stats.outputs.date }}"
          body: |
            ## Automatic EQ Database Update
            
            This PR was automatically generated by the monthly database update workflow.
            
            ### Changes
            - Updated `EQDatabase.db` with latest AutoEQ data
            - Database size: ${{ steps.stats.outputs.size }}
            - Build date: ${{ steps.stats.outputs.date }}
            
            ### Source
            - [AutoEQ Repository](https://github.com/jaakkopasanen/AutoEq)
            
            ---
            *This PR was created automatically. Please review before merging.*
          branch: update-eq-database-${{ steps.stats.outputs.date }}
          delete-branch: true
          labels: |
            database
            automated
