name: Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '**.db'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'
      - '.agents/skills/**'
      - '.githooks/**'
      - 'SystemEQ for Mac/Assets.xcassets/**'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '**.db'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'
      - '.agents/skills/**'
      - '.githooks/**'
      - 'SystemEQ for Mac/Assets.xcassets/**'

jobs:
  tooling:
    name: Tooling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify scripts and regression tests
        run: python3 Scripts/verify_tooling.py
      - name: Verify reproducible language icons
        run: |
          python3 -m venv "$RUNNER_TEMP/systemeq-icons"
          "$RUNNER_TEMP/systemeq-icons/bin/python" -m pip install -r Scripts/requirements-icons.txt
          "$RUNNER_TEMP/systemeq-icons/bin/python" Scripts/generate_language_icons.py --check

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat Check
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install SwiftFormat
        run: |
          set -euo pipefail
          SWIFTFORMAT_DIR="$RUNNER_TEMP/systemeq-swiftformat-0.63.1"
          mkdir -p "$SWIFTFORMAT_DIR"
          curl --fail --location --retry 3 \
            --output "$SWIFTFORMAT_DIR/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          printf '%s  %s\n' '385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb' "$SWIFTFORMAT_DIR/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$SWIFTFORMAT_DIR/swiftformat.zip" -d "$SWIFTFORMAT_DIR/bin"
          SWIFTFORMAT_VERSION="$("$SWIFTFORMAT_DIR/bin/swiftformat" --version)"
          test "$SWIFTFORMAT_VERSION" = "0.63.1"
          echo "$SWIFTFORMAT_DIR/bin" >> "$GITHUB_PATH"
      
      - name: Check formatting
        run: |
          swiftformat "SystemEQ for Mac" --config .swiftformat --lint
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'swiftformat .' locally."
            exit 1
          fi

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [tooling, swiftlint, swiftformat]
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify runtime tools under sanitizer
        env:
          SYSTEMEQ_TEST_SANITIZER: ${{ matrix.sanitizer }}
        run: python3 Scripts/test_runtime_tools.py
      - name: Verify audio and IPC tests under sanitizer
        env:
          SYSTEMEQ_TEST_SANITIZER: ${{ matrix.sanitizer }}
        run: |
          case "$SYSTEMEQ_TEST_SANITIZER" in
            address) sanitizer_option=-enableAddressSanitizer ;;
            thread) sanitizer_option=-enableThreadSanitizer ;;
            *) exit 2 ;;
          esac
          xcodebuild test \
            -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -destination "platform=macOS" \
            "$sanitizer_option" YES \
            '-only-testing:SystemEQ for MacTests/CoreAudioOutputTests' \
            '-only-testing:SystemEQ for MacTests/BiquadFilterTests' \
            '-only-testing:SystemEQ for MacTests/AudioEngineBandModeTests/testConcurrentFilterSwapAndRenderStress' \
            '-only-testing:SystemEQ for MacTests/AudioEngineBandModeTests/testConcurrentRoomFilterSwapAndRenderStress' \
            '-only-testing:SystemEQ for MacTests/ProjectMHelperClientTests' \
            CODE_SIGNING_ALLOWED=NO -quiet

  test:
    name: Test Check
    runs-on: macos-latest
    needs: [tooling, swiftlint, swiftformat, sanitizers]
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify DMG background in a clean workspace
        run: python3 Scripts/test_release_scripts.py DMGBackgroundWorkflowTests

      - name: Verify CPU measurement and IPC lifecycle
        run: python3 Scripts/test_runtime_tools.py
      
      - name: Verify signed update feed and failure paths
        run: python3 Scripts/test_update_feed.py

      - name: Verify Unique Database Resource
        run: |
          count=$(find . -name "EQDatabase.db" -not -path "./DerivedData/*" -not -path "./build/*" -not -path "./LocalArtifacts/*" | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 EQDatabase.db in repository, found $count"
            exit 1
          fi

      - name: Run Tests
        run: |
          xcodebuild -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -destination "platform=macOS" \
            test \
            CODE_SIGNING_ALLOWED=NO -quiet
