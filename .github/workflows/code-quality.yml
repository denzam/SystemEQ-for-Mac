name: Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '**.db'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'
      - '.agents/skills/**'
      - '.githooks/**'
      - 'SystemEQ for Mac/Assets.xcassets/**'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '**.db'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'
      - '.agents/skills/**'
      - '.githooks/**'
      - 'SystemEQ for Mac/Assets.xcassets/**'

jobs:
  tooling:
    name: Tooling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify scripts and regression tests
        run: python3 Scripts/verify_tooling.py
      - name: Verify reproducible language icons
        run: |
          python3 -m venv "$RUNNER_TEMP/systemeq-icons"
          "$RUNNER_TEMP/systemeq-icons/bin/python" -m pip install -r Scripts/requirements-icons.txt
          "$RUNNER_TEMP/systemeq-icons/bin/python" Scripts/generate_language_icons.py --check

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat Check
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Install SwiftFormat
        run: brew install swiftformat
      
      - name: Check formatting
        run: |
          swiftformat "SystemEQ for Mac" --config .swiftformat --lint
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'swiftformat .' locally."
            exit 1
          fi

  test:
    name: Test Check
    runs-on: macos-latest
    needs: [tooling, swiftlint, swiftformat]
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Verify Unique Database Resource
        run: |
          count=$(find . -name "EQDatabase.db" -not -path "./DerivedData/*" -not -path "./build/*" -not -path "./LocalArtifacts/*" | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 EQDatabase.db in repository, found $count"
            exit 1
          fi

      - name: Run Tests
        run: |
          xcodebuild -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -destination "platform=macOS" \
            test \
            CODE_SIGNING_ALLOWED=NO -quiet
