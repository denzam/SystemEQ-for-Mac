name: Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - '**.plist'
      - '**.pbxproj'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/**'
      - 'Scripts/**'

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat Check
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Install SwiftFormat
        run: brew install swiftformat
      
      - name: Check formatting
        run: |
          swiftformat "SystemEQ for Mac" --config .swiftformat --lint
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'swiftformat .' locally."
            exit 1
          fi

  test:
    name: Test Check
    runs-on: macos-latest
    needs: [swiftlint, swiftformat]
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Run Tests
        run: |
          xcodebuild -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -destination "platform=macOS" \
            test \
            CODE_SIGNING_ALLOWED=NO -quiet
