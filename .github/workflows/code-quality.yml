name: Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - '**.swift'
      - '.swiftformat'
      - '.swiftlint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat Check
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install SwiftFormat
        run: brew install swiftformat
      
      - name: Check formatting
        run: |
          swiftformat "SystemEQ for Mac" --config .swiftformat --lint
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'swiftformat .' locally."
            exit 1
          fi

  build:
    name: Build Check
    runs-on: macos-latest
    needs: [swiftlint, swiftformat]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: Build
        run: |
          xcodebuild -project "SystemEQ for Mac.xcodeproj" \
            -scheme "SystemEQ for Mac" \
            -configuration Debug \
            -destination "platform=macOS" \
            build \
            CODE_SIGNING_ALLOWED=NO
