<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="blob1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#5e5ce6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="60%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ff375f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1a6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Gradient mesh blobs -->
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>
  <rect width="1200" height="630" fill="url(#blob3)"/>

  <!-- Subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- EQ frequency curve illustration (subtle, top right) -->
  <g opacity="0.18" transform="translate(700, 120)">
    <path d="M 0 80 Q 50 40, 100 60 T 200 70 T 300 55 T 400 65"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="80" r="5" fill="#0a84ff"/>
    <circle cx="80" cy="50" r="5" fill="#0a84ff"/>
    <circle cx="160" cy="68" r="5" fill="#0a84ff"/>
    <circle cx="240" cy="58" r="5" fill="#ff9f0a"/>
    <circle cx="320" cy="62" r="5" fill="#ff9f0a"/>
    <circle cx="400" cy="65" r="5" fill="#0a84ff"/>
  </g>

  <!-- Pulsing dot pill (eyebrow) -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="280" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="22" cy="20" r="5" fill="#30d158" filter="url(#glow)"/>
    <text x="42" y="26" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial, sans-serif"
          font-size="15" fill="#a1a1a6" font-weight="500">Free &amp; open source · macOS 13+</text>
  </g>

  <!-- Main title -->
  <text x="80" y="295" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="108" font-weight="700" fill="url(#titleGrad)" letter-spacing="-4">SystemEQ</text>
  <text x="80" y="410" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="108" font-weight="700" fill="url(#accentGrad)" letter-spacing="-4">for Mac.</text>

  <!-- Subtitle -->
  <text x="80" y="475" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif"
        font-size="24" fill="#a1a1a6" font-weight="400">System-wide parametric equalizer for macOS</text>

  <!-- Badges -->
  <g transform="translate(80, 510)" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500">
    <g>
      <rect x="0" y="0" width="78" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="39" y="21" fill="#a1a1a6" text-anchor="middle">GPLv3</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="60" y="21" fill="#a1a1a6" text-anchor="middle">No telemetry</text>
    </g>
    <g transform="translate(222, 0)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="55" y="21" fill="#a1a1a6" text-anchor="middle">EN · IT · UK</text>
    </g>
    <g transform="translate(344, 0)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="90" y="21" fill="#a1a1a6" text-anchor="middle">8,850+ AutoEQ presets</text>
    </g>
  </g>

  <!-- URL bottom right -->
  <text x="1120" y="595" font-family="SF Mono, Menlo, monospace"
        font-size="14" fill="#6e6e73" text-anchor="end" letter-spacing="0.5">denzam.github.io/SystemEQ-for-Mac</text>
</svg>
