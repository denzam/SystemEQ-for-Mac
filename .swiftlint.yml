# SwiftLint Configuration for SystemEQ for Mac
# https://github.com/realm/SwiftLint

# Paths to include
included:
  - SystemEQ for Mac

# Paths to exclude
excluded:
  - .build
  - DerivedData
  - .swiftpm
  - Pods
  - Carthage
  - Scripts

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - identifier_name
  - large_tuple
  - todo
  - multiple_closures_with_trailing_closure
  - vertical_whitespace
  - type_name
  - function_parameter_count

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - fallthrough
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - inclusive_language
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_optional_binding
  - vertical_parameter_alignment_on_call
  - for_where
  - yoda_condition

# Rule configurations
force_cast:
  severity: warning

force_try:
  severity: warning

force_unwrapping:
  severity: warning

implicitly_unwrapped_optional:
  severity: warning

# Reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging)
reporter: "xcode"
